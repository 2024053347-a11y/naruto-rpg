<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preset editors harness</title>
  <style>
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html, body, #app { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #070a0e; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    const editorType = new URLSearchParams(location.search).get('editor') || 'main';
    const entries = Array.from({ length: 60 }, (_, index) => ({
      id: `fixture_${index + 1}`,
      name: `Fixture preset entry ${String(index + 1).padStart(2, '0')}`,
      enabled: true,
      role: 'system',
      activation: 'always',
      content: `Fixture preset content ${index + 1}`
    }));

    if (editorType === 'variable') {
      const { DEFAULT_VARIABLE_UPDATER_PRESET_VERSION } = await import('../../js/data/variable-updater-preset.js');
      localStorage.setItem('naruto_variable_updater_preset', JSON.stringify({
        name: 'Variable updater fixture',
        version: DEFAULT_VARIABLE_UPDATER_PRESET_VERSION,
        entries
      }));
      await import('../../js/ui/variable-updater-preset-editor.js');
      document.querySelector('#app').append(document.createElement('variable-updater-preset-editor'));
    } else {
      const { DEFAULT_MAIN_PRESET_VERSION } = await import('../../js/data/default-preset.js');
      localStorage.setItem('naruto_main_preset', JSON.stringify({
        name: 'Main preset fixture',
        _version: DEFAULT_MAIN_PRESET_VERSION,
        entries
      }));
      await import('../../js/ui/main-preset-editor.js');
      document.querySelector('#app').append(document.createElement('main-preset-editor'));
    }

    window.__PRESET_EDITOR_HARNESS_READY__ = true;
  </script>
</body>
</html>
